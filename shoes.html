<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shoes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #B78140;
      cursor: crosshair;
    }

    .shoe-image {
      position: fixed;
      width: 620px;              /* BIG images */
      height: auto;
      pointer-events: none;
    }
  </style>
</head>

<body>

<script>
  const shoeImages = [
    "images/shoes/shoes-1.jpeg",
    "images/shoes/shoes-2.jpeg",
    "images/shoes/shoes-3.jpeg",
    "images/shoes/shoes-4.jpeg",
    "images/shoes/shoes-5.jpeg",
    "images/shoes/shoes-6.jpeg",
    "images/shoes/shoes-7.jpeg",
    "images/shoes/shoes-8.jpeg",
    "images/shoes/shoes-9.jpeg",
    "images/shoes/shoes-10.jpeg",
    "images/shoes/shoes-11.jpeg",
    "images/shoes/shoes-12.jpeg",
    "images/shoes/shoes-13.jpeg"
  ];

  let currentIndex = 0;
  let currentImage = null;
  let lastX = null;
  let lastY = null;

  const MOVE_THRESHOLD = 100;
  const PADDING = 20;

  document.addEventListener("mousemove", (e) => {
    if (lastX !== null) {
      const dist =
        Math.abs(e.clientX - lastX) +
        Math.abs(e.clientY - lastY);

      if (dist < MOVE_THRESHOLD) return;
    }

    lastX = e.clientX;
    lastY = e.clientY;

    showNextImage(e.clientX, e.clientY);
  });

  function showNextImage(cursorX, cursorY) {
    // Remove previous image
    if (currentImage) {
      currentImage.remove();
      currentImage = null;
    }

    const img = document.createElement("img");
    img.className = "shoe-image";
    img.src = shoeImages[currentIndex];

    // TEMP position so it renders immediately
    img.style.left = "0px";
    img.style.top = "0px";

    document.body.appendChild(img);

    // AFTER browser lays it out, clamp position
    requestAnimationFrame(() => {
      const w = img.offsetWidth;
      const h = img.offsetHeight;

      let x = cursorX + 20;
      let y = cursorY + 20;

      if (x + w + PADDING > window.innerWidth) {
        x = window.innerWidth - w - PADDING;
      }
      if (x < PADDING) x = PADDING;

      if (y + h + PADDING > window.innerHeight) {
        y = window.innerHeight - h - PADDING;
      }
      if (y < PADDING) y = PADDING;

      img.style.left = x + "px";
      img.style.top = y + "px";
    });

    currentImage = img;
    currentIndex = (currentIndex + 1) % shoeImages.length;
  }
</script>

</body>
</html>
